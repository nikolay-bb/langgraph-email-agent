[project]
name = "langgraph_email_agent"
version = "0.1.0"
description = "Ambient email assistant with human-in-the-loop and memory"
requires-python = ">=3.11,<3.14"
dependencies = [
    "langchain>=1.0.0",
    "langchain-core>=1.0.0",
    "langchain-openai>=1.0.0",
    "langgraph>=1.0.0",
    "langgraph-cli[inmem]>=0.4.0",
    "google-api-python-client>=2.128.0",
    "google-auth-oauthlib",
    "google-auth-httplib2",
    "python-dotenv",
    "html2text",
]

[dependency-groups]
# The Telegram bot is a separate process from the graph. Keeping it in its own
# group means `uv sync` still installs a lean runtime, and the bot's
# dependencies never reach a deployed graph image. Install it with:
#   uv sync --group bot
bot = [
    "python-telegram-bot[job-queue]>=21.0",
    "langgraph-sdk>=0.1.0",
]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["py.typed"]
